  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <script>
    /* Letter collision — same effect as the homepage hero name (see
       index.html), reused here on the "All Projects" title. Travel
       distance is scoped to the intro section's own height, mirroring
       how the hero scopes it to its own section rather than the whole
       page. */
    (function() {
      if (typeof gsap === 'undefined' || typeof ScrollTrigger === 'undefined') return;
      gsap.registerPlugin(ScrollTrigger);

      const introSection = document.querySelector('.page-intro');

      function getTravelDistance() {
        return introSection ? introSection.offsetHeight : window.innerHeight;
      }

      function getRandomSpeed() {
        const randomDecimal = Math.random();
        return 0.8 + randomDecimal * (1.5 - 0.8);
      }

      function getRandomRotation() {
        return Math.random() * 60 - 30;
      }

      function animateLettersOnScroll(container) {
        const letterElements = container.querySelectorAll('.letter');

        letterElements.forEach((letter) => {
          if (!letter.hasAttribute('data-speed')) {
            letter.setAttribute('data-speed', getRandomSpeed());
          }

          gsap.to(letter, {
            y: (i, el) =>
              (1 - parseFloat(el.getAttribute('data-speed'))) *
              getTravelDistance(),
            ease: 'power2.out',
            duration: 0.8,
            scrollTrigger: {
              trigger: document.documentElement,
              start: 0,
              end: window.innerHeight,
              invalidateOnRefresh: true,
              scrub: 0.5
            },
            rotation: getRandomRotation()
          });
        });
      }

      const pageTitle = document.querySelector('.page-title');
      if (pageTitle) animateLettersOnScroll(pageTitle);
    })();
  </script>

            entry.target.classList.add('visible');
          }
        });
      }, { threshold: 0.08 });
      revealElements.forEach(el => revealObserver.observe(el));
    })();

      const modal = document.getElementById('projectModal');
      const modalClose = document.getElementById('projectModalClose');
      const modalTitle = document.getElementById('projectModalTitle');
      const modalTags = document.getElementById('projectModalTags');
      const modalContext = document.getElementById('projectModalContext');
      const tiles = document.querySelectorAll('[data-project]');

      function openProject(id) {
        const project = projects[id];
        if (!project) return;

        modalTitle.textContent = project.title;
        modalTags.innerHTML = project.tags.map(tag => `<span class="tile-tag">${tag}</span>`).join('');
        modalContext.innerHTML = project.context.map(p => `<p>${p}</p>`).join('');

        modal.classList.add('active');
        modal.scrollTop = 0;
        document.body.style.overflow = 'hidden';
      }

      function closeProject() {
        modal.classList.remove('active');
        document.body.style.overflow = '';
      }

      tiles.forEach(tile => {
        tile.addEventListener('click', () => {
          const id = tile.getAttribute('data-project');
          history.replaceState(null, '', `#${id}`);
          openProject(id);
        });
      });

      modalClose.addEventListener('click', closeProject);
      modal.addEventListener('click', (e) => {
        if (e.target === modal) closeProject();
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeProject();
      });

      function openFromHash() {
        const id = window.location.hash.replace('#', '');
        if (projects[id]) openProject(id);
      }

      window.addEventListener('hashchange', openFromHash);
      openFromHash();
    })();
  </script>
